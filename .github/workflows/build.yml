name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Packages are noarch; one x86_64 SDK build serves every target.
      # Pinned to the release the theme is developed against.
      - name: Build with the OpenWrt 25.12.5 SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: x86_64-25.12.5
          FEEDNAME: nacre
          PACKAGES: luci-theme-nacre luci-app-nacre-config
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1

      - name: Collect packages
        run: |
          mkdir -p dist
          find bin/packages -name 'luci-*nacre*.apk' -exec cp {} dist/ \;
          ls -la dist
          test "$(ls dist/*.apk | wc -l)" -ge 3

      - uses: actions/upload-artifact@v4
        with:
          name: nacre-apks
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nacre-apks
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "nacre ${GITHUB_REF_NAME#v}" \
            --generate-notes
